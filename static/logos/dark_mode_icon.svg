<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="shinyMoon" cx="0.5" cy="0.5" fx="0.68" fy="0.5" r="1">
            <stop offset="0%" stop-color="rgb(255, 255, 200)"/>
            <stop offset="30%" stop-color="yellow"/>
            <stop offset="90%" stop-color="orange"/>
        </radialGradient>
    </defs>

    <ellipse cx="12" cy="12" ry="11" fill="rgba(0, 0, 0, 0.5)"/>
    <path 
        d="M 9.5, 1.3
            A 11 11 0 1 1 9.5, 22.7
            A 11 11 0 0 0 9.5, 1.3" 
        fill="url(#shinyMoon)"
    />
</svg>